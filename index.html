<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--Py-script CDN-->
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
        <!-- This script tag bootstraps PyScript -->
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Candidate Verification System</title>

    <style>
        body {
            background: linear-gradient(110deg, rgb(53, 53, 81), rgb(72, 98, 72));
            padding: 20px;
            align-content: center;
        }
        h5 {
            text-align: center;
            font-size: 20px;
            color: rgb(130, 143, 127);
        }

        h1 {
            text-align: center;
            font-size: 50px;
            margin-top: 10px;
            color: rgb(163, 175, 160);
        }
        form {
            background-color: rgb(42, 37, 37);
            border-color: rgb(90, 29, 29);
            border-style: groove;
            padding: 20px;
            max-width: 360px;
            margin:auto;
            margin-top: 40px;
            box-shadow: 0px 5px 1px rgba(0,0,0,0.1);
            align-items: center;
        }
        input[type='text'] {
            height: 30px;
            border-width: 3px;
            border-style: solid;
            border-color: rgb(90, 29, 29);
            width: 300px;
            background-color: rgb(201, 201, 201);
            margin: 10px;
            box-shadow: 0px 5px 1px rgba(0,0,0,0.1);
        }
        input[type='button'] {
            border-width: 2px;
            border-style: solid;
            border-color: rgb(137, 107, 107);
            border-radius: 3px;
            width: 200px;
            background-color: rgb(90, 10, 10);
            color: rgb(230, 228, 228);
            margin: 15px;
            margin-top: 20px;
            box-shadow: 0px 5px 1px rgba(0,0,0,0.1);
            height: 35px;
        }

        #output {
            align-items: center;
            color: rgb(202, 212, 200);
            font-weight: bold;
            font-size: 15px;
            background-color: #6c6c6c;
            border-color: #383838;
            border-style: solid;
            padding: 10px;
            max-width: 360px;
            margin:auto;
            margin-top: 30px;
            height: 30px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>The FAYZ Club</h1>
        <h5>Candidate Verification System</h5>
    </div>
    <form>
        <input type="text" id="firstName" placeholder="Enter your First Name"><br>
        <input type="text" id="lastName" placeholder="Enter your Last Name"><br>
        <input type="button" py-click="verify_candidate" value="Verify Candidacy">
        <div id="output"></div>
    </form>

    
    <py-script src="main.py"></py-script>
</body>
</html>
